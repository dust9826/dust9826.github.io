<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Tech Matrix Base -->
  <polygon points="24,3 43,13.5 43,34.5 24,45 5,34.5 5,13.5" fill="url(#neonGlow)" stroke="url(#techGrad)" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Isometric Inner Cube / Core -->
  <polygon points="24,10 38,18 24,26 10,18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="10,18 24,26 24,40 10,32" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="38,18 24,26 24,40 38,32" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Center Core Terminal Point -->
  <circle cx="24" cy="26" r="2.5" fill="#38bdf8" />
  <line x1="24" y1="3" x2="24" y2="10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="1 2" />
  <line x1="5" y1="34.5" x2="10" y2="32" stroke="#6366f1" stroke-width="1.5" />
  <line x1="43" y1="34.5" x2="38" y2="32" stroke="#a855f7" stroke-width="1.5" />
</svg>
